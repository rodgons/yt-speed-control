# Submits the add-on to addons.mozilla.org (listed) whenever a GitHub release is published.
# The version then goes through Mozilla's review; once approved it is public on AMO and
# installed copies update through Firefox.
#
# Release tags must be versions, e.g. v1.2.0 (the leading "v" is optional).
# Needs repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET
# (https://addons.mozilla.org/developers/addon/api/key/).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Set version from release tag
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Release tag '$TAG' is not a version like v1.2.0"
            exit 1
          fi
          jq --arg v "$version" '.version = $v' extension/manifest.json > manifest.tmp
          mv manifest.tmp extension/manifest.json

      - name: Lint
        run: npx --yes web-ext@8 lint --source-dir extension --warnings-as-errors

      - name: Submit to AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # Don't wait for review: listed versions can take days to be approved.
        run: npx --yes web-ext@8 sign --source-dir extension --artifacts-dir dist --channel listed --approval-timeout 0
